<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>BS Blueprint Complete — CleverTap In-App Creative</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                font-family: "Inter", sans-serif;
                background: transparent;
                overflow: hidden;
            }

            .overlay {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.72);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: clamp(8px, 4vw, 16px);
                z-index: 999;
                transition: opacity 0.3s ease;
            }
            .overlay.hidden {
                opacity: 0;
                pointer-events: none;
            }

            .card {
                background: #fff;
                border-radius: 14px;
                overflow: hidden;
                width: 100%;
                max-width: 360px;
                max-height: 96vh;
                overflow-y: auto;
                position: relative;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            }
            .card::-webkit-scrollbar {
                display: none;
            }

            .close-btn {
                position: absolute;
                top: 10px;
                right: 10px;
                width: 26px;
                height: 26px;
                border-radius: 50%;
                border: none;
                background: rgba(0, 0, 0, 0.18);
                color: #fff;
                font-size: 14px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10;
                line-height: 1;
                transition: background 0.15s;
            }
            .close-btn:hover {
                background: rgba(0, 0, 0, 0.35);
            }

            .cover-white {
                background: #fff;
                padding: clamp(8px, 3vw, 10px) clamp(10px, 4vw, 14px) 6px;
            }
            .issue-line {
                font-size: 8px;
                letter-spacing: 0.14em;
                color: #555;
                font-family: "Inter", sans-serif;
                margin-bottom: 3px;
            }
            .bs-brand {
                font-family: "Playfair Display", serif;
                font-size: 13px;
                font-weight: 700;
                color: #c0181a;
                margin-bottom: 0;
                letter-spacing: 0.01em;
            }
            .bp-word {
                font-family: "Playfair Display", serif;
                font-size: clamp(34px, 13vw, 52px);
                font-weight: 900;
                color: #111;
                line-height: 0.86;
                letter-spacing: -1.5px;
            }
            .defence-bar {
                display: flex;
                align-items: center;
                margin: 6px 0 0;
            }
            .defence-bar .dline {
                flex: 1;
                height: 0.5px;
                background: #aaa;
            }

            .cover-red {
                background: #fff;
                padding: 10px;
            }
            .cover-red img {
                display: block;
                width: 100%;
                height: auto;
            }

            .roll-zone {
                text-align: center;
                margin-bottom: 6px;
            }
            .roll-zone svg {
                width: 100px;
                height: 62px;
                max-width: 100%;
            }

            .cs-eyebrow {
                text-align: center;
                font-size: 7px;
                letter-spacing: 0.18em;
                color: rgba(255, 255, 255, 0.65);
                font-family: "Inter", sans-serif;
                margin-bottom: 2px;
                text-transform: uppercase;
            }
            .cs-headline {
                text-align: center;
                font-family: "Playfair Display", serif;
                font-size: clamp(16px, 6vw, 20px);
                font-weight: 900;
                color: #fff;
                line-height: 1;
                text-transform: uppercase;
                margin-bottom: 6px;
            }
            .cs-sub {
                text-align: center;
                font-size: 10px;
                color: rgba(255, 255, 255, 0.8);
                font-style: italic;
                font-family: "Playfair Display", serif;
                line-height: 1.35;
                margin-bottom: 8px;
            }

            .three-col {
                display: grid;
                grid-template-columns: minmax(60px, 82px) 1fr minmax(60px, 82px);
                gap: 4px;
                margin-bottom: 7px;
                align-items: start;
            }
            .side-stack {
                display: flex;
                flex-direction: column;
                gap: 8px;
                min-width: 0;
            }
            .s-eye {
                font-size: 8px;
                letter-spacing: 0.12em;
                color: rgba(255, 255, 255, 0.55);
                text-transform: uppercase;
                font-family: "Inter", sans-serif;
                margin-bottom: 1px;
            }
            .s-title {
                font-family: "Playfair Display", serif;
                font-size: 8px;
                font-weight: 700;
                color: #fff;
                line-height: 1.2;
                text-transform: uppercase;
                overflow-wrap: break-word;
            }
            .right-side {
                text-align: right;
            }
            .center-art {
                display: flex;
                align-items: flex-end;
                justify-content: center;
                min-width: 0;
            }
            .center-art svg {
                width: 100%;
                height: 46px;
                max-width: 100%;
            }

            .expert-box {
                background: rgba(0, 0, 0, 0.28);
                border-radius: 4px;
                padding: 10px;
            }
            .ev-tag {
                font-size: 6px;
                letter-spacing: 0.12em;
                color: rgba(255, 255, 255, 0.55);
                border: 0.5px solid rgba(255, 255, 255, 0.3);
                display: inline-block;
                padding: 1px 5px;
                margin-bottom: 4px;
                font-family: "Inter", sans-serif;
                text-transform: uppercase;
            }
            .ev-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
                gap: 6px;
            }
            .ev-name {
                font-size: 7.5px;
                font-weight: 700;
                color: #fff;
                font-family: "Inter", sans-serif;
            }
            .ev-topic {
                font-size: 6.5px;
                color: rgba(255, 255, 255, 0.65);
                font-style: italic;
                font-family: "Inter", sans-serif;
                margin-top: 1px;
                line-height: 1.3;
            }

            .offer-strip {
                background: #fff;
                padding: clamp(8px, 3vw, 10px);
            }

            .offer-header {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                flex-wrap: wrap;
                margin-bottom: 8px;
                gap: 8px;
            }
            .offer-title {
                font-family: "Playfair Display", serif;
                font-size: clamp(15px, 5vw, 18px);
                font-weight: 700;
                color: #111;
                line-height: 1.1;
            }
            .offer-title span {
                color: #c0181a;
            }
            .off-badge {
                background: #c0181a;
                color: #fff;
                font-size: clamp(12px, 4vw, 15px);
                font-weight: 700;
                padding: 5px 10px;
                border-radius: 4px;
                white-space: nowrap;
                font-family: "Inter", sans-serif;
                letter-spacing: 0.02em;
                flex-shrink: 0;
            }

            .price-row {
                display: flex;
                align-items: baseline;
                flex-wrap: wrap;
                gap: 0px;
                margin-bottom: 15px;
                margin-top: 15px;
            }
            .p-strike {
                font-size: clamp(13px, 4.5vw, 16px);
                color: #bbb;
                text-decoration: line-through;
                font-family: "Inter", sans-serif;
                margin-right: 10px;
            }
            .p-now {
                font-family: "Playfair Display", serif;
                font-size: clamp(22px, 8vw, 28px);
                font-weight: 700;
                color: #111;
                line-height: 1;
            }
            .p-yr {
                font-size: clamp(12px, 4vw, 14px);
                color: #888;
                font-family: "Inter", sans-serif;
            }

            .cd-head {
                font-size: clamp(10px, 3.5vw, 12px);
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: #888;
                margin-bottom: 10px;
                font-family: "Inter", sans-serif;
                text-align: center;
            }
            .cd-dates {
                font-size: 9px;
                color: #c0181a;
                font-weight: 700;
                font-family: "Inter", sans-serif;
                margin-bottom: 6px;
                letter-spacing: 0.02em;
            }
            .cd-blocks {
                display: grid;
                grid-template-columns: 1fr auto 1fr auto 1fr;
                align-items: center;
                gap: clamp(2px, 1vw, 4px);
                margin-bottom: 12px;
            }
            .cd-b {
                background: #111;
                border-radius: 7px;
                padding: 8px 2px;
                text-align: center;
                min-width: 0;
            }
            .cd-n {
                font-family: "Playfair Display", serif;
                font-size: clamp(18px, 7vw, 24px);
                font-weight: 700;
                color: #fff;
                line-height: 1;
            }
            .cd-u {
                font-size: clamp(6.5px, 2vw, 7.5px);
                color: rgba(255, 255, 255, 0.5);
                margin-top: 3px;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                font-family: "Inter", sans-serif;
            }
            .cd-sep {
                text-align: center;
                font-size: clamp(14px, 5vw, 18px);
                font-weight: 700;
                color: #c0181a;
                line-height: 1;
                padding-bottom: 10px;
            }

            .sub-btn {
                display: block;
                width: 100%;
                padding: clamp(11px, 3.5vw, 13px);
                background: #c0181a;
                color: #fff;
                border: none;
                border-radius: 8px;
                font-size: clamp(13px, 4vw, 14px);
                font-weight: 700;
                cursor: pointer;
                text-align: center;
                font-family: "Inter", sans-serif;
                letter-spacing: 0.03em;
                transition:
                    background 0.15s,
                    transform 0.1s;
            }
            .sub-btn:hover {
                background: #9e1214;
            }
            .sub-btn:active {
                transform: scale(0.98);
            }

            .fine-print {
                text-align: center;
                font-size: 9px;
                color: #bbb;
                margin-top: 8px;
                font-family: "Inter", sans-serif;
            }
            .defence-bar .dtxt {
                font-size: clamp(8px, 2.5vw, 9px);
                letter-spacing: 1.5px;
                color: #151515;
                padding: 2px 6px;
                font-family: arial;
                white-space: nowrap;
                margin-bottom: 10px;
            }
            .logo {
                width: min(300px, 80%);
                max-width: 100%;
                margin-top: 5px;
            }
            .logo img {
                display: block;
                width: 100%;
                height: auto;
            }
            .digital {
                font-size: clamp(12px, 4vw, 15px);
                margin-top: 5px;
                display: block;
                text-align: left;
            }

            /* Very small / very short viewports */
            @media (max-width: 340px) {
                .three-col {
                    grid-template-columns: 56px 1fr 56px;
                }
            }

            @media (max-height: 560px) {
                .overlay {
                    align-items: flex-start;
                }
                .card {
                    max-height: 98vh;
                    margin-top: 2vh;
                }
            }
        </style>
    </head>
    <body>
        <div class="overlay" id="overlay">
            <div
                class="card"
                role="dialog"
                aria-modal="true"
                aria-label="Blueprint Complete offer"
            >
                <button
                    class="close-btn"
                    id="close-btn"
                    aria-label="Close"
                    onclick="closePopup()"
                >
                    ✕
                </button>

                <!-- White header -->
                <div class="cover-white">
                    <div class="logo">
                        <img
                            src="https://d16nmctz6udcu8.cloudfront.net/1704350464/assets/4094a6a9f30647188616754a92623751.png"
                            alt=""
                        />
                    </div>
                </div>

                <!-- Red section -->
                <div class="cover-red">
                    <img
                        src="https://d16nmctz6udcu8.cloudfront.net/1704350464/assets/2a01a3ad20514884baec8e99473a6d29.jpg"
                        alt=""
                    />
                </div>

                <!-- Offer strip -->
                <div class="offer-strip">
                    <div class="offer-header">
                        <div>
                            <div class="offer-title">
                                Blueprint <span>Complete</span>
                            </div>
                            <span class="digital">(digital & print)</span>
                        </div>

                        <div class="off-badge">₹1,000 OFF</div>
                    </div>

                    <div class="price-row">
                        <span class="p-strike">₹4,500</span>
                        <span class="p-now">₹3,500</span>
                        <span class="p-yr">/year</span>
                    </div>

                    <div class="cd-head">OFFER EXPIRES IN</div>

                    <div class="cd-blocks">
                        <div class="cd-b">
                            <div class="cd-n" id="cd-d">--</div>
                            <div class="cd-u">Days</div>
                        </div>
                        <div class="cd-sep">:</div>
                        <div class="cd-b">
                            <div class="cd-n" id="cd-h">--</div>
                            <div class="cd-u">Hrs</div>
                        </div>
                        <div class="cd-sep">:</div>
                        <div class="cd-b">
                            <div class="cd-n" id="cd-m">--</div>
                            <div class="cd-u">Mins</div>
                        </div>
                    </div>

                    <!-- Replace the URL below with your actual Blueprint Complete subscribe link -->
                    <button
                        class="sub-btn"
                        id="sub-btn"
                        onclick="
                            window.open(
                                'https://www.business-standard.com/subscribe?plan=blueprint-complete&offer=july2026',
                                '_blank',
                            );
                            setTimeout(closePopup, 300);
                        "
                    >
                        Subscribe Now
                    </button>
                </div>
            </div>
        </div>

        <script>
            /* Countdown to 9 July 2026 11:59 PM */
            var end = new Date("2026-07-09T23:59:59");

            function pad(n) {
                return String(n).padStart(2, "0");
            }

            function tick() {
                var diff = end - new Date();
                if (diff <= 0) {
                    ["cd-d", "cd-h", "cd-m"].forEach(function (id) {
                        document.getElementById(id).textContent = "00";
                    });
                    var btn = document.getElementById("sub-btn");
                    btn.style.opacity = "0.4";
                    btn.style.cursor = "not-allowed";
                    btn.textContent = "Offer has ended";
                    btn.onclick = null;
                    return;
                }
                document.getElementById("cd-d").textContent = pad(
                    Math.floor(diff / 864e5),
                );
                document.getElementById("cd-h").textContent = pad(
                    Math.floor((diff % 864e5) / 36e5),
                );
                document.getElementById("cd-m").textContent = pad(
                    Math.floor((diff % 36e5) / 6e4),
                );
            }

            tick();
            setInterval(tick, 1000);

            function closePopup() {
                try {
                    // Remove CleverTap's parent wrapper elements
                    var overlay =
                        window.parent.document.getElementById(
                            "intentOpacityDiv",
                        );
                    var wrapper =
                        window.parent.document.getElementById("intentPreview");
                    if (overlay) overlay.remove();
                    if (wrapper) wrapper.remove();
                } catch (error) {
                    console.error("Error removing parent elements:", error);
                }
                // Fallback: hide the local overlay too
                document.getElementById("overlay").style.display = "none";
            }

            /* Close handlers */
            document
                .getElementById("overlay")
                .addEventListener("click", function (e) {
                    if (e.target === this) closePopup();
                });
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") closePopup();
            });
        </script>
    </body>
</html>
