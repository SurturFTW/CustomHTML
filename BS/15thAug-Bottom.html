    /* Container to group elements horizontally */
    .banner-content {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 40px;
        width: 100%;
        max-width: 1200px;
        justify-content: center;
    }

    /* Text Section */
    .text-section {
        text-align: left;
        flex-shrink: 0;
    }

    .headline {
        font-size: 24px;
        font-weight: 800;
        text-transform: capitalize;
        line-height: 1.1;

        letter-spacing: -0.5px;
        color: #8f1313;
    }

    .subtext {
        font-size: 16px;
        font-weight: 400;
        display: block;
        margin-top: 4px;
        opacity: 0.95;
        color: #8f1313;
    }

    /* Timer Section */
    .timer-wrapper {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }

    .timer-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        margin-bottom: 4px;
        margin-left: 2px;
        color: #8f1313;
        letter-spacing: 0.5px;
    }

    .timer-display {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .time-box {
        position: relative;
        z-index: 2;
        background: rgba(255, 255, 255, 0.97);
        color: #8f1313;
        font-weight: 800;
        font-size: 22px;
        padding: 8px 10px;
        border-radius: 5px;
        border: 1px solid rgba(143, 19, 19, 0.12);
        box-shadow:
            0 3px 0 rgba(35, 35, 35, 0.08),
            0 7px 16px rgba(35, 35, 35, 0.07);
        min-width: 65px;
        text-align: center;
        line-height: 1;
        display: flex;
        justify-content: center;
        align-items: baseline;
    }

    .unit {
        font-size: 12px;
        font-weight: 700;
        margin-left: 2px;
        color: #8f1313;
    }

    .colon {
        position: relative;
        z-index: 2;
        font-size: 22px;
        font-weight: 800;
        color: #8f1313;
        margin-top: -8px;
    }

    /* CTA Button */
    .cta-btn {
        position: relative;
        z-index: 2;
        background: rgba(255, 255, 255, 0.98);
        color: #8f1313;
        text-decoration: none;
        border: 1px solid rgba(143, 19, 19, 0.15);
        padding: 0 25px;
        height: 48px;
        font-size: 16px;
        font-weight: 900;
        text-transform: uppercase;
        border-radius: 5px;
        box-shadow: 0 4px 12px rgba(35, 35, 35, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        margin-top: 16px;
        transition:
            transform 0.1s,
            box-shadow 0.1s;
    }

    .cta-btn:hover {
        background-color: #f9f9f9;
    }

    .cta-btn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #cfcfcf;
    }

    /* Close Button */
    .close-btn {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: #8f1313;
        opacity: 0.82;
        font-size: 28px;
        cursor: pointer;
        padding: 5px;
        line-height: 1;
        z-index: 4;
    }

    .close-btn:hover {
        opacity: 1;
    }

    /* --- RESPONSIVE BREAKPOINTS --- */

    @media (min-width: 1200px) {
        .sticky-banner {

    /* Tablet */
    @media (max-width: 950px) {

            align-items: center;

            top: 10px;

    @media (max-width: 480px) {
        .sticky-banner {
            background-position: center 85%;

            font-size: 18px;
        }

            font-size: 19px;
        }

            font-size: 13px;
        }

                <div class="colon">:</div>
                <div class="time-box">
                    <span id="minutes">00</span><span class="unit">M</span>
                </div>
                <div class="colon">:</div>
                <div class="time-box">
                    <span id="seconds">00</span><span class="unit">S</span>
                </div>
            </div>
        </div>

        <!-- CTA Button -->
        <a
            href="https://www.business-standard.com/special-subscription-offer"
            target="_blank"
            class="cta-btn"
        >
            SUBSCRIBE NOW
        </a>
    </div>

    <!-- Close Button -->
    <button
        class="close-btn"
        onclick="
            document.getElementById('bsStickyBanner').style.display = 'none'
        "
    >
        ×
    </button>
</div>

<script>
    const targetDate = new Date("August 21, 2026 23:59:00").getTime();

    function updateCountdown() {
        const now = new Date().getTime();
        const distance = targetDate - now;

        if (distance < 0) {
            document.getElementById("days").innerText = "00";
            document.getElementById("hours").innerText = "00";
            document.getElementById("minutes").innerText = "00";
            document.getElementById("seconds").innerText = "00";
            return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor(
            (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
        );
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("days").innerText =
            days < 10 ? "0" + days : days;
        document.getElementById("hours").innerText =
            hours < 10 ? "0" + hours : hours;
        document.getElementById("minutes").innerText =
            minutes < 10 ? "0" + minutes : minutes;
        document.getElementById("seconds").innerText =
            seconds < 10 ? "0" + seconds : seconds;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>
